<!doctype html>
<html lang="hu">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illusztrált Tarokk · Online</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202020;background:#eee9df}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:22px}.table{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0001}.top,.matchbar,.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0}.top{border-bottom:1px solid #ddd}.top button,.actions button,.forms button{min-height:42px;padding:9px 13px;border:1px solid #bbb;border-radius:9px;background:#fff;cursor:pointer}.top button{background:#222;color:#fff;border-color:#222}.room-code{font-family:ui-monospace,monospace;letter-spacing:.12em;font-weight:800}.connection{margin-left:auto}.good,.ok{font-weight:700}.status{min-height:36px;color:#555}.panel{margin-top:15px;padding:15px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.player{display:flex;flex-direction:column;gap:4px;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff}.player span,.muted,.server{font-size:13px;color:#666}.player.me{border-width:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.card{min-height:88px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px solid #252525;border-radius:12px;background:#fff;color:#111;box-shadow:0 2px 0 #0002;cursor:not-allowed}.card small{margin-top:5px;color:#252525;font-size:13px;font-weight:700}.card.tarokk{background:#fff4c7;border-color:#7a5b00}.card.suit-hearts{background:#ffe5e5;border-color:#8d1b1b}.card.suit-diamonds{background:#fff0dc;border-color:#925100}.card.suit-spades{background:#e7edf4;border-color:#27384d}.card.suit-clubs{background:#e3f1e7;border-color:#275b38}.card.active{cursor:pointer;box-shadow:0 0 0 2px #111}.card.disabled{opacity:.55}.card.selected{outline:4px solid #111;transform:translateY(-4px)}.trick{disp
