<!doctype html>
<html lang="hu">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illusztrált Tarokk · Online</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202020;background:#eee9df}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:22px}.table{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0001}.top,.matchbar,.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0}.top{border-bottom:1px solid #ddd}.top button,.actions button,.forms button{min-height:46px;padding:10px 14px;border:2px solid #888;border-radius:10px;background:#fff;color:#111;font-weight:800;cursor:pointer}.top button{background:#222;color:#fff;border-color:#222}.room-code{font-family:ui-monospace,monospace;letter-spacing:.12em;font-weight:800}.connection{margin-left:auto}.good,.ok{font-weight:700}.status{min-height:36px;color:#555}.panel{margin-top:15px;padding:15px;border:1px solid #ddd;border-radius:12px;background:#fafafa}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.player{display:flex;flex-direction:column;gap:4px;padding:11px;border:1px solid #ddd;border-radius:9px;background:#fff}.player span,.muted,.server{font-size:13px;color:#666}.player.me{border-width:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hand{display:grid;grid-template-columns:repeat(5,minmax(112px,1fr));gap:10px;align-items:stretch}.card{min-height:102px;padding:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px solid #202020;border-radius:14px;background:#fff;color:#111;box-shadow:0 3px 0 #0003;cursor:not-allowed}.card strong{font-size:22px;line-height:1.15;font-weight:900;letter-spacing:.01em}.card small{margin-top:7px;color:#111;font-size:13px;font-weight:800}.card.tarokk{background:#ffe46b;border-color:#5d4300}.card.suit-hearts{background:#ffd0d0;border-color:#780000}.card.suit-diamonds{background:#ffdda8;border-color:#6b3500}.card.suit-spades{background:#cfddf0;border-color:#142943}.card.suit-clubs{background:#cbe8d1;border-color:#123f20}.card.active{cursor:pointer;box-shadow:0 0 0 3px #111,0 4px 0 #0003}.card.disabled{opacity:1;filter:saturate(.85);background:#f4f4f4;border-color:#8a8a8a;color:#222}.card.disabled small{color:#333}.card.selected{outline:5px solid #000;transform:translateY(-5px);filter:none}@media(max-width:900px){.hand{grid-template-columns:repeat(4,minmax(100px,1fr))}}.trick{display:flex;gap:8px;flex-wrap:wrap}.public-skart-wrap{margin-top:10px}.public-skart{display:inline-block;margin:3px 6px 3px 0;padding:7px 9px;border:2px solid #222;border-radius:9px;background:#f5f1df;font-size:13px}.played{width:110px;height:76px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:1px solid #aaa;border-radius:10px;background:#fff}.forms{display:grid;grid-template-columns:1fr 1fr;gap:20px}.forms>div{display:flex;flex-direction:column;gap:10px}.forms label{display:flex;flex-direction:column;gap:5px}.forms input{min-height:42px;border:1px solid #bbb;border-radius:8px;padding:8px;font:inherit}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee9df;font-size:12px;font-weight:700}@media(max-width:700px){.wrap{padding:8px}.table{padding:12px}.players{grid-template-columns:1fr 1fr}.forms{grid-template-columns:1fr}.hand{grid-template-columns:repeat(3,minmax(0,1fr))}.top{position:sticky;top:0;background:#fff;z-index:3}.actions button{width:100%}.actions{display:grid;grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><div class="table"><div id="app"></div></div></div><script type="module" src="./multiplayer.js"></script></body></html>
